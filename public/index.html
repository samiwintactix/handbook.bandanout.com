<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Track and aggregate handbook expectation feedback across Jira, Slack, and manual observations." />
  <title>Bandanaut — Expectations dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --ink: #111827;
  --ink-soft: #5f6879;
  --navy: #15192b;
  --navy-2: #222740;
  --paper: #f4f5f8;
  --surface: #ffffff;
  --line: #e3e6eb;
  --line-strong: #d3d7df;
  --violet: #6754e9;
  --violet-dark: #5140d3;
  --violet-soft: #efedff;
  --red: #c93e52;
  --red-soft: #fff0f2;
  --amber: #a45f06;
  --amber-soft: #fff5df;
  --green: #147a58;
  --green-soft: #eaf8f1;
  --blue: #2763c7;
  --blue-soft: #ecf3ff;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 12px 32px rgba(20, 24, 40, .05);
}

* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background: var(--paper);
  font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0, 1fr); }
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 25px 16px 18px;
  display: flex;
  flex-direction: column;
  background: var(--navy);
  color: #eef0f7;
  border-right: 1px solid #252a42;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 30px; }
.brand-mark { width: 27px; height: 27px; display: flex; align-items: flex-end; gap: 3px; padding: 5px; border-radius: 8px; background: var(--violet); }
.brand-mark span { flex: 1; background: white; border-radius: 2px; }
.brand-mark span:nth-child(1) { height: 44%; opacity: .72; }
.brand-mark span:nth-child(2) { height: 72%; opacity: .85; }
.brand-mark span:nth-child(3) { height: 100%; }
.brand-name { font: 700 1.05rem/1 "Manrope", sans-serif; letter-spacing: -.03em; }
.nav-list { display: grid; gap: 5px; }
.nav-item {
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 11px;
  color: #aeb4c6;
  background: transparent;
  text-decoration: none;
  cursor: pointer;
  font-size: .91rem;
  font-weight: 600;
  text-align: left;
  transition: .18s ease;
}
.nav-item svg { width: 18px; height: 18px; }
.nav-item .external { width: 14px; height: 14px; margin-left: auto; opacity: .55; }
.nav-item:hover { color: #fff; background: rgba(255,255,255,.055); }
.nav-item.active { color: #fff; background: var(--navy-2); box-shadow: inset 3px 0 0 var(--violet); }
.sidebar-bottom { margin-top: auto; display: grid; gap: 5px; width: 100%; }
.profile { margin-top: 12px; padding: 13px 9px 0; border-top: 1px solid #2b3048; display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 9px; width: 100%; box-sizing: border-box; }
.profile strong { display: block; font-size: .84rem; }
.profile span { display: block; margin-top: 2px; color: #858ca2; font-size: .72rem; }
.profile .icon-button { color: #8e94a8; }
.signout-btn { display: block; margin-top: 4px; border: 0; background: transparent; color: #858ca2; font-size: .72rem; font-weight: 600; cursor: pointer; padding: 0; white-space: nowrap; text-decoration: none; }
.signout-btn:hover { color: #fff; text-decoration: underline; }

.main { min-width: 0; }
.topbar {
  min-height: 102px;
  padding: 22px 32px 20px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  background: rgba(255,255,255,.9);
  border-bottom: 1px solid var(--line);
}
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 0; font: 800 1.72rem/1.15 "Manrope", sans-serif; letter-spacing: -.045em; }
h2 { margin-bottom: 0; font: 700 1.28rem/1.3 "Manrope", sans-serif; letter-spacing: -.035em; }
h3 { margin-bottom: 0; font: 700 1rem/1.35 "Manrope", sans-serif; letter-spacing: -.02em; }
.eyebrow { margin-bottom: 7px; display: flex; align-items: center; gap: 7px; color: var(--ink-soft); font-size: .78rem; font-weight: 600; }
.live-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.demo-pill { padding: 3px 7px; color: #695f85; background: #f0eef8; border: 1px solid #e1dcef; border-radius: 999px; font-size: .68rem; letter-spacing: .01em; }
.top-actions { display: flex; gap: 9px; }
.button {
  min-height: 42px;
  padding: 0 15px;
  border: 1px solid transparent;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: .86rem;
  font-weight: 700;
  cursor: pointer;
  transition: .18s ease;
}
.button svg { width: 17px; height: 17px; }
.button.primary { color: white; background: var(--violet); box-shadow: 0 5px 14px rgba(103,84,233,.2); }
.button.primary:hover { background: var(--violet-dark); transform: translateY(-1px); }
.button.secondary { color: #343a49; background: white; border-color: var(--line-strong); }
.button.secondary:hover { border-color: #b9bfca; background: #fafafa; }
.filter-count { min-width: 20px; height: 20px; padding: 0 5px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--violet-dark); background: var(--violet-soft); font-size: .72rem; }
.icon-button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 9px; display: inline-grid; place-items: center; background: white; cursor: pointer; }
.icon-button:hover { background: #f7f7f9; }
.icon-button.subtle { width: 30px; height: 30px; border: 0; background: transparent; }

.view { display: none; padding: 24px 32px 40px; }
.view.active { display: block; }
.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 13px; margin-bottom: 16px; }
.summary-card { min-height: 112px; padding: 17px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(20,24,40,.025); }
.summary-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.summary-card p { margin: 0; color: var(--ink-soft); font-size: .8rem; font-weight: 600; }
.summary-card strong { display: block; margin-top: 9px; font: 800 1.55rem/1 "Manrope", sans-serif; letter-spacing: -.04em; }
.summary-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 8px; }
.summary-icon svg { width: 16px; height: 16px; }
.summary-icon.violet { color: var(--violet); background: var(--violet-soft); }
.summary-icon.red { color: var(--red); background: var(--red-soft); }
.summary-icon.amber { color: var(--amber); background: var(--amber-soft); }
.summary-icon.green { color: var(--green); background: var(--green-soft); }
.summary-meta { margin-top: 7px; color: #8b93a1; font-size: .71rem; }

.workspace-card, .table-card, .activity-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.workspace-toolbar { min-height: 65px; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
.search-wrap { width: min(330px, 100%); height: 40px; padding: 0 11px; display: flex; align-items: center; gap: 8px; background: #f7f8fa; border: 1px solid #e8eaf0; border-radius: 9px; }
.search-wrap:focus-within { background: white; border-color: #b9b1f6; box-shadow: 0 0 0 3px var(--violet-soft); }
.search-wrap svg { width: 17px; height: 17px; color: #9299a7; flex: 0 0 auto; }
.search-wrap input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: .84rem; }
.search-wrap input::placeholder { color: #969ca8; }
.search-wrap.compact { width: 290px; background: white; }
.period-switch { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: #f7f8fa; }
.period-switch button { height: 30px; padding: 0 10px; border: 0; border-radius: 6px; color: #7a8190; background: transparent; cursor: pointer; font-size: .74rem; font-weight: 600; }
.period-switch button.active { color: var(--ink); background: white; box-shadow: 0 1px 3px rgba(20,24,40,.11); }

.people-workspace { display: grid; grid-template-columns: minmax(315px, .8fr) minmax(470px, 1.45fr); min-height: 525px; }
.people-panel { border-right: 1px solid var(--line); min-width: 0; }
.panel-heading { min-height: 43px; padding: 0 17px; display: flex; align-items: center; justify-content: space-between; color: #9298a5; background: #fafafa; border-bottom: 1px solid var(--line); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .055em; }
.person-row { width: 100%; min-height: 69px; padding: 10px 15px; border: 0; border-bottom: 1px solid #eceef2; display: grid; grid-template-columns: 38px minmax(0,1fr) auto 15px; align-items: center; gap: 10px; background: white; text-align: left; cursor: pointer; transition: .16s ease; }
.person-row:last-child { border-bottom: 0; }
.person-row:hover { background: #fafafe; }
.person-row.active { position: relative; background: #f5f3ff; }
.person-row.active::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--violet); }
.person-row .chevron { width: 15px; height: 15px; color: #b3b8c3; }
.person-row.active .chevron { color: var(--violet); }
.avatar { width: 38px; height: 38px; display: grid; place-items: center; color: #413873; background: #e8e4ff; border: 1px solid #d9d2ff; border-radius: 10px; font-size: .72rem; font-weight: 800; letter-spacing: .01em; }
.avatar-owner { width: 34px; height: 34px; border-radius: 9px; color: white; background: var(--violet); border-color: transparent; }
.avatar.c2 { color: #69411d; background: #f8e8d5; border-color: #efd8bb; }
.avatar.c3 { color: #285c4b; background: #def3e9; border-color: #cce9dd; }
.avatar.c4 { color: #2f5684; background: #e2edfa; border-color: #d0e1f5; }
.avatar.c5 { color: #764150; background: #f9e5eb; border-color: #f1d4dc; }
.person-copy { min-width: 0; }
.person-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .84rem; }
.person-copy span { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-soft); font-size: .72rem; }
.signal-count { min-width: 29px; height: 25px; padding: 0 7px; display: grid; place-items: center; border-radius: 7px; color: #6e7582; background: #f1f2f5; font-size: .72rem; font-weight: 800; }
.signal-count.has-signals { color: var(--red); background: var(--red-soft); }

.person-detail { min-width: 0; }
.detail-header { min-height: 104px; padding: 20px 22px 17px; display: flex; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line); }
.detail-person { display: flex; gap: 12px; align-items: flex-start; }
.detail-person .avatar { width: 44px; height: 44px; font-size: .78rem; }
.detail-person h2 { margin-top: 1px; }
.detail-person p { margin: 4px 0 0; color: var(--ink-soft); font-size: .78rem; }
.capacity-pill { display: inline-flex; margin-top: 8px; padding: 3px 7px; border-radius: 5px; color: #536075; background: #eef0f4; font-size: .65rem; font-weight: 700; }
.detail-actions { display: flex; align-items: flex-start; gap: 7px; }
.detail-actions .button { min-height: 36px; padding: 0 11px; font-size: .76rem; }
.detail-tabs { height: 48px; padding: 0 22px; display: flex; align-items: flex-end; gap: 25px; border-bottom: 1px solid var(--line); }
.detail-tab { height: 48px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; color: #858c99; background: transparent; cursor: pointer; font-size: .76rem; font-weight: 700; }
.detail-tab.active { color: var(--ink); border-bottom-color: var(--violet); }
.expectation-list { padding: 6px 22px 16px; }
.empty-state { min-height: 290px; padding: 40px 24px; display: grid; place-items: center; text-align: center; }
.empty-state-icon { width: 48px; height: 48px; margin: 0 auto 13px; display: grid; place-items: center; border-radius: 14px; color: var(--green); background: var(--green-soft); }
.empty-state h3 { margin-bottom: 6px; }
.empty-state p { max-width: 320px; margin-bottom: 0; color: var(--ink-soft); font-size: .81rem; line-height: 1.55; }
.expectation-item { padding: 15px 0; border-bottom: 1px solid #eceef2; }
.expectation-item:last-child { border-bottom: 0; }
.expectation-top { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: start; }
.expectation-title { display: flex; gap: 10px; align-items: flex-start; }
.status-bar { width: 4px; height: 35px; flex: 0 0 auto; border-radius: 8px; background: var(--amber); }
.status-bar.repeated { background: var(--red); }
.expectation-title h3 { font-size: .87rem; }
.expectation-title p { margin: 4px 0 0; color: var(--ink-soft); font-size: .7rem; }
.expectation-count { text-align: right; }
.expectation-count strong { display: block; font: 800 1.18rem/1 "Manrope", sans-serif; }
.expectation-count span { color: #8a919f; font-size: .65rem; }
.expectation-footer { margin-top: 11px; padding-left: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.source-chip, .status-chip { height: 25px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; font-size: .67rem; font-weight: 700; }
.source-chip svg { width: 13px; height: 13px; }
.source-chip.jira { color: #2255a4; background: var(--blue-soft); }
.source-chip.slack { color: #6b3b69; background: #f6ebf5; }
.source-chip.manual { color: #566071; background: #eff1f4; }
.status-chip.repeated { color: var(--red); background: var(--red-soft); }
.status-chip.open { color: var(--amber); background: var(--amber-soft); }
.status-chip.discussed { color: var(--green); background: var(--green-soft); }
.expectation-link { margin-left: auto; border: 0; display: inline-flex; align-items: center; gap: 4px; color: var(--violet-dark); background: transparent; cursor: pointer; font-size: .69rem; font-weight: 700; }
.expectation-link svg { width: 13px; height: 13px; }

.section-intro { min-height: 76px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
.section-kicker { margin-bottom: 5px; color: var(--violet); font-size: .69rem; line-height: 1; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.expectations-table { min-width: 830px; }
.table-row { min-height: 70px; padding: 11px 18px; display: grid; grid-template-columns: minmax(260px,1.9fr) 90px 120px 120px 96px 22px; align-items: center; gap: 16px; border-bottom: 1px solid #eceef2; }
.table-row:last-child { border-bottom: 0; }
.table-row.header { min-height: 43px; color: #8c93a0; background: #fafafa; font-size: .67rem; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: .055em; }
.table-row:not(.header):hover { background: #fbfbfe; }
.expectation-cell strong { display: block; font-size: .83rem; }
.expectation-cell span { display: block; margin-top: 3px; color: var(--ink-soft); font-size: .7rem; }
.metric-cell strong { display: block; font: 800 .92rem/1.1 "Manrope", sans-serif; }
.metric-cell span { color: #8c93a0; font-size: .67rem; }
.people-stack { display: flex; }
.mini-avatar { width: 27px; height: 27px; margin-left: -5px; display: grid; place-items: center; border: 2px solid white; border-radius: 8px; color: #413873; background: #e8e4ff; font-size: .57rem; font-weight: 800; }
.mini-avatar:first-child { margin-left: 0; }
.mini-avatar.more { color: #6f7683; background: #eef0f3; }
.trend { color: var(--red); font-size: .72rem; font-weight: 800; }
.trend.down { color: var(--green); }

.activity-toolbar { min-height: 64px; padding: 11px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.activity-toolbar > span { color: #8a919e; font-size: .72rem; }
.activity-row { min-height: 76px; padding: 13px 18px; display: grid; grid-template-columns: 38px minmax(0, 1.5fr) minmax(180px, .8fr) 135px 110px 24px; align-items: center; gap: 14px; border-bottom: 1px solid #eceef2; }
.activity-row:last-child { border-bottom: 0; }
.activity-main strong { display: block; font-size: .82rem; }
.activity-main p { margin: 3px 0 0; color: var(--ink-soft); font-size: .71rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.activity-expectation { color: #394151; font-size: .74rem; font-weight: 600; }
.activity-source { font-size: .72rem; }
.activity-date { color: #7f8796; font-size: .7rem; }
.activity-row .chevron { width: 15px; height: 15px; color: #b2b7c1; }

.modal-backdrop { position: fixed; inset: 0; z-index: 50; padding: 18px; display: none; place-items: center; background: rgba(14,17,30,.55); backdrop-filter: blur(3px); }
.modal-backdrop.open { display: grid; }
.modal { width: min(570px, 100%); max-height: calc(100vh - 36px); overflow: auto; background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 28px 80px rgba(14,17,30,.28); }
.modal-header { padding: 21px 22px 16px; display: flex; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); }
.modal-header h2 { font-size: 1.17rem; }
.modal form { padding: 19px 22px 22px; }
.field { display: block; margin-bottom: 15px; }
.field > span { margin-bottom: 7px; display: flex; justify-content: space-between; color: #4d5564; font-size: .75rem; font-weight: 700; }
.field em { color: #9da3ae; font-size: .67rem; font-style: normal; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; outline: 0; color: var(--ink); background: white; font-size: .82rem; }
.field input, .field select { height: 42px; padding: 0 11px; }
.field textarea { padding: 10px 11px; resize: vertical; line-height: 1.45; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: #a89df2; box-shadow: 0 0 0 3px var(--violet-soft); }
.field-row { display: grid; grid-template-columns: .7fr 1.3fr; gap: 12px; }
.toggle-row { margin: 3px 0 20px; padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: #f7f6fe; border: 1px solid #e4e0fb; border-radius: 10px; cursor: pointer; }
.toggle-row input { position: absolute; opacity: 0; pointer-events: none; }
.toggle { grid-row: 1 / span 2; width: 35px; height: 21px; padding: 3px; border-radius: 99px; background: #c4c8d1; transition: .2s; }
.toggle span { width: 15px; height: 15px; display: block; border-radius: 99px; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .2s; }
.toggle-row input:checked + .toggle { background: var(--violet); }
.toggle-row input:checked + .toggle span { transform: translateX(14px); }
.toggle-row strong { display: block; color: #303747; font-size: .76rem; }
.toggle-row small { display: block; margin-top: 3px; color: #727a89; font-size: .68rem; line-height: 1.4; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; z-index: 70; right: 24px; bottom: 24px; min-width: 245px; max-width: calc(100vw - 48px); padding: 12px 15px; display: flex; align-items: center; gap: 10px; color: white; background: #202536; border: 1px solid #31384e; border-radius: 10px; box-shadow: 0 12px 34px rgba(14,17,30,.28); opacity: 0; transform: translateY(15px); pointer-events: none; transition: .22s ease; font-size: .8rem; font-weight: 700; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast-icon { width: 22px; height: 22px; display: grid; place-items: center; color: white; background: var(--green); border-radius: 99px; }
.toast-icon svg { width: 13px; height: 13px; stroke-width: 2.4; }

@media (max-width: 1120px) {
  .app-shell { grid-template-columns: 78px minmax(0,1fr); }
  .sidebar { padding-left: 10px; padding-right: 10px; }
  .brand { justify-content: center; padding-left: 0; padding-right: 0; }
  .brand-name, .nav-item span, .nav-item .external, .profile > div:not(.avatar), .signout-btn { display: none; }
  .nav-item { justify-content: center; padding: 0; }
  .profile { grid-template-columns: 1fr; justify-items: center; padding-left: 0; padding-right: 0; }
  .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .activity-row { grid-template-columns: 38px minmax(0,1.5fr) minmax(160px,.8fr) 120px 90px 20px; }
}

@media (max-width: 860px) {
  .topbar { padding: 19px 20px; align-items: center; }
  .view { padding: 19px 20px 34px; }
  .eyebrow { max-width: 380px; flex-wrap: wrap; }
  .people-workspace { grid-template-columns: 1fr; }
  .people-panel { border-right: 0; }
  .person-row.active::before { width: 100%; height: 2px; inset: auto 0 0; }
  .person-detail { border-top: 8px solid var(--paper); }
  .activity-card { overflow-x: auto; }
  .activity-row { min-width: 820px; }
  .table-card { overflow-x: auto; }
}

<body>

  <script>
let team = [];
let expectations = [];
let signals = [];

let selectedPersonId = null;
let currentPeriod = "30";
let detailTab = "signals";
let toastTimer;

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
const personById = id => team.find(person => person.id === id);
const expectationById = id => expectations.find(expectation => expectation.id === id);
const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character]));

function periodSignals() {
  if (currentPeriod === "all") return signals;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - Number(currentPeriod));
  return signals.filter(signal => new Date(signal.date) >= cutoff);
}

function formatDate(date, withTime = false) {
  const value = new Date(date);
  const options = withTime
    ? { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }
    : { month: "short", day: "numeric" };
  return new Intl.DateTimeFormat("en", options).format(value);
}

function relativeDate(date) {
  const diff = Math.max(0, Date.now() - new Date(date).getTime());
  const days = Math.floor(diff / 86400000);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return `${days} days ago`;
  return formatDate(date);
}

function sourceIcon(source) {
  return source === "jira" ? "jira" : source === "slack" ? "slack" : "note";
}

function sourceName(source) {
  return source === "jira" ? "Jira" : source === "slack" ? "Slack" : "Manual";
}

function groupedSignals(list, keyFn) {
  return list.reduce((groups, signal) => {
    const key = keyFn(signal);
    (groups[key] ||= []).push(signal);
    return groups;
  }, {});
}

function avatar(person, mini = false) {
  if (!person) return mini ? `<span class="mini-avatar" title="Unknown">?</span>` : `<span class="avatar">?</span>`;
  if (mini) return `<span class="mini-avatar ${person.color}" title="${escapeHtml(person.name)}">${person.initials}</span>`;
  return `<span class="avatar ${person.color}">${person.initials}</span>`;
}

function renderSummary() {
  const visible = periodSignals();
  const open = visible.filter(signal => signal.status === "open");
  const affectedPeople = new Set(open.map(signal => signal.personId)).size;
  const groups = groupedSignals(visible, signal => `${signal.personId}:${signal.expectationId}`);
  const repeats = Object.values(groups).filter(group => group.length >= 2).length;
  const latestWeek = visible.filter(signal => Date.now() - new Date(signal.date).getTime() <= 7 * 86400000).length;
  const priorWeek = visible.filter(signal => {
    const age = Date.now() - new Date(signal.date).getTime();
    return age > 7 * 86400000 && age <= 14 * 86400000;
  }).length;
  const trend = latestWeek - priorWeek;
  $("#summaryGrid").innerHTML = `
    <article class="summary-card">
      <div class="summary-card-head"><p>People needing follow-up</p><span class="summary-icon violet"><svg><use href="#icon-users"></use></svg></span></div>
      <strong>${affectedPeople}</strong><div class="summary-meta">of ${team.length} current team members</div>
    </article>
    <article class="summary-card">
      <div class="summary-card-head"><p>Open signals</p><span class="summary-icon red"><svg><use href="#icon-activity"></use></svg></span></div>
      <strong>${open.length}</strong><div class="summary-meta">${trend >= 0 ? "+" : ""}${trend} compared with last week</div>
    </article>
    <article class="summary-card">
      <div class="summary-card-head"><p>Repeated patterns</p><span class="summary-icon amber"><svg><use href="#icon-activity"></use></svg></span></div>
      <strong>${repeats}</strong><div class="summary-meta">same person + expectation, 2× or more</div>
    </article>
    <article class="summary-card">
      <div class="summary-card-head"><p>No open signals</p><span class="summary-icon green"><svg><use href="#icon-check"></use></svg></span></div>
      <strong>${team.length - affectedPeople}</strong><div class="summary-meta">across the selected period</div>
    </article>`;
}

function renderPeople() {
  const query = $("#peopleSearch").value.trim().toLowerCase();
  const visible = periodSignals();
  const filteredTeam = team.filter(person => `${person.name} ${person.role}`.toLowerCase().includes(query));
  $("#peopleList").innerHTML = filteredTeam.map(person => {
    const openCount = visible.filter(signal => signal.personId === person.id && signal.status === "open").length;
    return `<button class="person-row ${person.id === selectedPersonId ? "active" : ""}" data-person="${person.id}">
      ${avatar(person)}
      <span class="person-copy"><strong>${escapeHtml(person.name)}</strong><span>${escapeHtml(person.role)}</span></span>
      <span class="signal-count ${openCount ? "has-signals" : ""}">${openCount}</span>
      <svg class="chevron"><use href="#icon-chevron"></use></svg>
    </button>`;
  }).join("") || `<div class="empty-state"><div><h3>No people found</h3><p>Try another name or role.</p></div></div>`;
  renderPersonDetail();
}

function renderPersonDetail() {
  const person = personById(selectedPersonId) || team[0];
  if (!person) {
    $("#personDetail").innerHTML = `<div class="empty-state"><div><h3>No signals recorded yet</h3><p>Flag a missed expectation in Jira or Slack, and it will show up here.</p></div></div>`;
    return;
  }
  const list = periodSignals().filter(signal => signal.personId === person.id).sort((a,b) => new Date(b.date) - new Date(a.date));
  const groups = Object.entries(groupedSignals(list, signal => signal.expectationId))
    .map(([expectationId, items]) => ({ expectation: expectationById(expectationId), items }))
    .sort((a,b) => b.items.length - a.items.length);
  const openCount = list.filter(signal => signal.status === "open").length;
  const content = detailTab === "activity"
    ? renderPersonActivity(list)
    : groups.length ? groups.map(group => renderExpectationGroup(group)).join("") : `
      <div class="empty-state"><div><span class="empty-state-icon"><svg><use href="#icon-check"></use></svg></span><h3>No signals in this period</h3><p>Nothing has been recorded against ${escapeHtml(person.name)} for the selected period.</p></div></div>`;

  $("#personDetail").innerHTML = `
    <div class="detail-header">
      <div class="detail-person">${avatar(person)}<div><h2>${escapeHtml(person.name)}</h2><p>${escapeHtml(person.role)}</p><span class="capacity-pill">${escapeHtml(person.capacity)}</span></div></div>
      <div class="detail-actions">
        <button class="button secondary" data-record-person="${person.id}"><svg><use href="#icon-plus"></use></svg> Add signal</button>
        ${openCount ? `<button class="button secondary" data-discuss-all="${person.id}"><svg><use href="#icon-check"></use></svg> Mark discussed</button>` : ""}
      </div>
    </div>
    <div class="detail-tabs">
      <button class="detail-tab ${detailTab === "signals" ? "active" : ""}" data-detail-tab="signals">Expectations ${groups.length ? `(${groups.length})` : ""}</button>
      <button class="detail-tab ${detailTab === "activity" ? "active" : ""}" data-detail-tab="activity">Activity (${list.length})</button>
    </div>
    <div class="expectation-list">${content}</div>`;
}

function renderExpectationGroup({ expectation, items }) {
  if (!expectation) return "";
  const open = items.filter(item => item.status === "open").length;
  const repeated = items.length >= 2;
  const latest = [...items].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
  const sources = [...new Set(items.map(item => item.source))];
  return `<article class="expectation-item">
    <div class="expectation-top">
      <div class="expectation-title"><span class="status-bar ${repeated ? "repeated" : ""}"></span><div><h3>${escapeHtml(expectation.title)}</h3><p>${escapeHtml(expectation.category)} · Last recorded ${relativeDate(latest.date)}</p></div></div>
      <div class="expectation-count"><strong>${items.length}</strong><span>${items.length === 1 ? "signal" : "signals"}</span></div>
    </div>
    <div class="expectation-footer">
      ${sources.map(source => `<span class="source-chip ${source}"><svg><use href="#icon-${sourceIcon(source)}"></use></svg>${sourceName(source)}</span>`).join("")}
      ${repeated ? `<span class="status-chip repeated">Repeated pattern</span>` : ""}
      <span class="status-chip ${open ? "open" : "discussed"}">${open ? `${open} open` : "Discussed"}</span>
      <a class="expectation-link" href="${expectation.url}" target="_blank" rel="noreferrer">View expectation <svg><use href="#icon-external"></use></svg></a>
    </div>
  </article>`;
}

function renderPersonActivity(list) {
  if (!list.length) return `<div class="empty-state"><div><span class="empty-state-icon"><svg><use href="#icon-check"></use></svg></span><h3>No activity</h3><p>No expectation signals were recorded during this period.</p></div></div>`;
  return list.map(signal => {
    const expectation = expectationById(signal.expectationId);
    if (!expectation) return "";
    return `<article class="expectation-item">
      <div class="expectation-top"><div class="expectation-title"><span class="source-chip ${signal.source}"><svg><use href="#icon-${sourceIcon(signal.source)}"></use></svg>${sourceName(signal.source)}</span><div><h3>${escapeHtml(expectation.title)}</h3><p>${escapeHtml(signal.note || "No additional context")} · ${escapeHtml(signal.by)}</p></div></div><div class="expectation-count"><strong>${formatDate(signal.date)}</strong><span>${escapeHtml(signal.reference)}</span></div></div>
    </article>`;
  }).join("");
}

function renderExpectations() {
  const query = $("#expectationsSearch").value.trim().toLowerCase();
  const visible = periodSignals();
  const rows = expectations.map(expectation => {
    const list = visible.filter(signal => signal.expectationId === expectation.id);
    const people = [...new Set(list.map(signal => signal.personId))].map(personById).filter(Boolean);
    const repeats = Object.values(groupedSignals(list, signal => signal.personId)).filter(group => group.length >= 2).length;
    return { expectation, list, people, repeats };
  }).filter(row => row.list.length && `${row.expectation.title} ${row.expectation.category}`.toLowerCase().includes(query))
    .sort((a,b) => b.list.length - a.list.length);

  $("#expectationsTable").innerHTML = `
    <div class="table-row header"><span>Expectation</span><span>Signals</span><span>People</span><span>Repeated by</span><span>Trend</span><span></span></div>
    ${rows.map(row => {
      const latestWeek = row.list.filter(signal => Date.now() - new Date(signal.date).getTime() <= 7 * 86400000).length;
      const trendDown = latestWeek === 0;
      return `<div class="table-row" data-expectation-row="${row.expectation.id}" tabindex="0" role="button">
        <div class="expectation-cell"><strong>${escapeHtml(row.expectation.title)}</strong><span>${escapeHtml(row.expectation.category)}</span></div>
        <div class="metric-cell"><strong>${row.list.length}</strong><span>${row.list.filter(signal => signal.status === "open").length} open</span></div>
        <div class="people-stack">${row.people.slice(0,3).map(person => avatar(person,true)).join("")}${row.people.length > 3 ? `<span class="mini-avatar more">+${row.people.length - 3}</span>` : ""}</div>
        <div class="metric-cell"><strong>${row.repeats}</strong><span>${row.repeats === 1 ? "person" : "people"}</span></div>
        <span class="trend ${trendDown ? "down" : ""}">${trendDown ? "↓ Quiet" : `↑ ${latestWeek} new`}</span>
        <svg class="chevron"><use href="#icon-chevron"></use></svg>
      </div>`;
    }).join("") || `<div class="empty-state"><div><h3>No expectations found</h3><p>Try a different search.</p></div></div>`}`;
}

function renderActivity() {
  const query = $("#activitySearch").value.trim().toLowerCase();
  const list = [...periodSignals()].sort((a,b) => new Date(b.date) - new Date(a.date)).filter(signal => {
    const person = personById(signal.personId);
    const expectation = expectationById(signal.expectationId);
    if (!person || !expectation) return false;
    return `${person.name} ${expectation.title} ${sourceName(signal.source)} ${signal.reference}`.toLowerCase().includes(query);
  });
  $("#activityCount").textContent = `${list.length} ${list.length === 1 ? "record" : "records"}`;
  $("#activityList").innerHTML = list.map(signal => {
    const person = personById(signal.personId);
    const expectation = expectationById(signal.expectationId);
    if (!person || !expectation) return "";
    return `<div class="activity-row" data-activity="${signal.id}" tabindex="0" role="button">
      ${avatar(person)}
      <div class="activity-main"><strong>${escapeHtml(person.name)} was tagged</strong><p>${escapeHtml(signal.note || "No additional context")}</p></div>
      <div class="activity-expectation">${escapeHtml(expectation.short)}</div>
      <span class="source-chip ${signal.source}"><svg><use href="#icon-${sourceIcon(signal.source)}"></use></svg>${sourceName(signal.source)} · ${escapeHtml(signal.reference)}</span>
      <div class="activity-date">${formatDate(signal.date, true)}<br>by ${escapeHtml(signal.by)}</div>
      <svg class="chevron"><use href="#icon-chevron"></use></svg>
    </div>`;
  }).join("") || `<div class="empty-state"><div><h3>No activity found</h3><p>Try another search term.</p></div></div>`;
}

function renderAll() {
  renderSummary();
  renderPeople();
  renderExpectations();
  renderActivity();
}

function setView(view) {
  const titles = { people: "People", expectations: "Expectations", activity: "Activity" };
  $$(".view").forEach(element => element.classList.toggle("active", element.id === `${view}View`));
  $$(".nav-item[data-view]").forEach(button => {
    const active = button.dataset.view === view;
    button.classList.toggle("active", active);
    active ? button.setAttribute("aria-current", "page") : button.removeAttribute("aria-current");
  });
  $("#viewTitle").textContent = titles[view];
}

function openModal(personId = selectedPersonId) {
  $("#feedbackPerson").value = personId;
  $("#feedbackModal").classList.add("open");
  $("#feedbackModal").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#feedbackExpectation").focus(), 30);
}

function closeModal() {
  $("#feedbackModal").classList.remove("open");
  $("#feedbackModal").setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

function showToast(message) {
  clearTimeout(toastTimer);
  $("#toastText").textContent = message;
  $("#toast").classList.add("show");
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 2800);
}

async function markDiscussed(personId) {
  const openIds = signals.filter(signal => signal.personId === personId && signal.status === "open").map(signal => signal.id);
  signals = signals.map(signal => signal.personId === personId ? { ...signal, status: "discussed" } : signal);
  renderAll();
  showToast(`Open signals for ${personById(personId).name} marked as discussed`);
  try {
    await fetch("/api/signals/discuss", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: openIds })
    });
  } catch (err) {
    console.error("Failed to persist discussed status", err);
  }
}

function exportCsv() {
  const rows = [["Date", "Person", "Expectation", "Source", "Reference", "Recorded by", "Status", "Context"]];
  [...signals].sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(signal => {
    const person = personById(signal.personId);
    const expectation = expectationById(signal.expectationId);
    rows.push([
      signal.date,
      person ? person.name : signal.personId,
      expectation ? expectation.title : signal.expectationId,
      sourceName(signal.source),
      signal.reference,
      signal.by,
      signal.status,
      signal.note
    ]);
  });
  const csv = rows.map(row => row.map(value => `"${String(value ?? "").replaceAll('"', '""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "expectation-signals.csv";
  link.click();
  URL.revokeObjectURL(url);
  showToast("CSV exported");
}

function initializeForm() {
  $("#feedbackPerson").innerHTML = team.map(person => `<option value="${person.id}">${escapeHtml(person.name)} — ${escapeHtml(person.role)}</option>`).join("");
  $("#feedbackExpectation").innerHTML = expectations.map(expectation => `<option value="${expectation.id}">${escapeHtml(expectation.title)}</option>`).join("");
}

document.addEventListener("click", event => {
  const nav = event.target.closest("[data-view]");
  if (nav) setView(nav.dataset.view);

  const personRow = event.target.closest("[data-person]");
  if (personRow) {
    selectedPersonId = personRow.dataset.person;
    detailTab = "signals";
    renderPeople();
  }

  const detailTabButton = event.target.closest("[data-detail-tab]");
  if (detailTabButton) {
    detailTab = detailTabButton.dataset.detailTab;
    renderPersonDetail();
  }

  const record = event.target.closest("[data-record-person]");
  if (record) openModal(record.dataset.recordPerson);

  const discuss = event.target.closest("[data-discuss-all]");
  if (discuss) markDiscussed(discuss.dataset.discussAll);

  const expectationRow = event.target.closest("[data-expectation-row]");
  if (expectationRow) {
    const expectation = expectationById(expectationRow.dataset.expectationRow);
    if (expectation) showToast(`${expectation.short}: aggregated across the team`);
  }

  const activityRow = event.target.closest("[data-activity]");
  if (activityRow) {
    const signal = signals.find(item => item.id === activityRow.dataset.activity);
    if (signal) showToast(`${sourceName(signal.source)} source: ${signal.reference}`);
  }
});

$("#addFeedbackButton").addEventListener("click", () => openModal());
$("#closeModalButton").addEventListener("click", closeModal);
$("#cancelModalButton").addEventListener("click", closeModal);
$("#feedbackModal").addEventListener("click", event => { if (event.target === $("#feedbackModal")) closeModal(); });
document.addEventListener("keydown", event => { if (event.key === "Escape") closeModal(); });
$("#peopleSearch").addEventListener("input", renderPeople);
$("#expectationsSearch").addEventListener("input", renderExpectations);
$("#activitySearch").addEventListener("input", renderActivity);
$("#exportButton").addEventListener("click", exportCsv);
$("#settingsButton").addEventListener("click", () => showToast("Integration settings would live here"));
$("#signOutButton").addEventListener("click", () => { window.location.href = "/auth/logout"; });
$("#filterButton").addEventListener("click", () => showToast("Showing current team members only"));

$$('[data-period]').forEach(button => button.addEventListener("click", () => {
  currentPeriod = button.dataset.period;
  $$('[data-period]').forEach(item => item.classList.toggle("active", item === button));
  renderAll();
}));

$("#feedbackSource").addEventListener("change", event => {
  const source = event.target.value;
  const label = source === "jira" ? "The Jira bot will add a comment with a link to the handbook." : source === "slack" ? "This will be saved on the dashboard (Slack posting from here isn't wired up yet)." : "Manual notes are recorded only in this dashboard.";
  $("#notifyHelp").textContent = label;
  $("#feedbackNotify").disabled = source === "manual";
  $("#feedbackNotify").checked = source !== "manual";
});

$("#feedbackForm").addEventListener("submit", async event => {
  event.preventDefault();
  const personId = $("#feedbackPerson").value;
  const expectationId = $("#feedbackExpectation").value;
  const source = $("#feedbackSource").value;
  const reference = $("#feedbackReference").value.trim();
  const note = $("#feedbackNote").value.trim();
  const notify = $("#feedbackNotify").checked;

  const submitButton = event.target.querySelector('button[type="submit"]');
  submitButton.disabled = true;

  try {
    const res = await fetch("/api/signals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ personId, expectationId, source, reference, note, notify })
    });
    const data = await res.json();
    if (data.signal) signals.unshift(data.signal);
    selectedPersonId = personId;
    detailTab = "signals";
    event.target.reset();
    $("#feedbackNotify").checked = true;
    closeModal();
    setView("people");
    renderAll();
    const person = personById(personId);
    const expectation = expectationById(expectationId);
    showToast(`${person ? person.name : "Signal"} tagged: ${expectation ? expectation.short : ""}`);
  } catch (err) {
    console.error(err);
    showToast("Failed to save. Try again.");
  } finally {
    submitButton.disabled = false;
  }
});

async function bootstrap() {
  try {
    const res = await fetch("/api/data");
    const data = await res.json();
    team = data.team || [];
    expectations = data.expectations || [];
    signals = data.signals || [];
    selectedPersonId = team[0] ? team[0].id : null;
    if (data.currentUser) {
      $("#currentUserAvatar").textContent = data.currentUser.initials || "?";
      $("#currentUserName").textContent = data.currentUser.name || data.currentUser.email || "Signed in";
      $("#currentUserEmail").textContent = data.currentUser.email || "";
    }
    initializeForm();
    renderAll();
  } catch (err) {
    console.error("Failed to load dashboard data", err);
    $("#peopleList").innerHTML = `<div class="empty-state"><div><h3>Could not load data</h3><p>Check that the server is running and Jira/Confluence credentials are set.</p></div></div>`;
  }
}

bootstrap();

  </script>
